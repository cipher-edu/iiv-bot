upstream pgadmin_upstream {
    server pgadmin:80;
}

upstream grafana_upstream {
    server grafana:3000;
}

upstream minio_upstream {
    server minio:9001;
}

# Path-based routing for localhost access (alternative to subdomain-based in nginx.conf)
# Only used if server_name matches "localhost"
server {
    listen 8080;
    server_name localhost;

    include /etc/nginx/security_headers.conf;

    location /pgadmin/ {
        proxy_pass http://pgadmin_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_redirect off;
    }

    location /grafana/ {
        proxy_pass http://grafana_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/grafana/(.*) /$1 break;
    }

    location /grafana/api/live/ {
        proxy_pass http://grafana_upstream/api/live/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /minio/ {
        proxy_pass http://minio_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/minio/(.*) /$1 break;
    }

    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    location / {
        return 404;
    }
}
