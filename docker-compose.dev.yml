version: "3.9"

# Development overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./bot:/app/bot
    environment:
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    command: python -m bot.main

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
